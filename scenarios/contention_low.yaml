model: Qwen/Qwen2.5-1.5B-Instruct        # the model the published result was produced with
# The published runs used this model on a 24 GiB MIG slice. INFERENCE_MODEL overrides it;
# whatever is in effect is recorded in requests.json, so a run is self-documenting. The
# default is the one that reproduces the result rather than the largest model that would
# fit somewhere, because a reader who clones this and runs it should get the published
# numbers and not a different experiment.
endpoint: http://localhost:8000/v1/chat/completions
timeout_s: 600
max_connections: 128

# One point on the aggressor-intensity sweep. The victim workload is identical across every
# point and across baseline.yaml: the sweep varies one thing.
#
# docs/METHOD.md requires the full curve rather than the point with the largest effect. A
# single intensity cannot distinguish "pressure causes this" from "this intensity happens to
# produce a number worth reporting".
#
# Prompt sizing, measured on the runtime under test: 1500 filler words occupied 5156 KV
# tokens. With max_tokens on top, one aggressor holds roughly 60-90% of an 8192-token pool,
# so they serialise and the pool stays occupied for as long as they keep arriving.
workloads:
  victim:
    count: 400
    rate_per_s: 4               # 100s of victim traffic
    prompt_words: 60            # ~180 tokens
    max_tokens: 64
    start_delay_s: 2            # enter once the first aggressor holds blocks
  aggressor:
    count: 6
    rate_per_s: 0.25
    prompt_words: 1500
    max_tokens: 1024
    start_delay_s: 0
